    <script>
      // Starts the big downloads (Patch, Art 1's two prop batches) at once, in parallel with the JavaScript, and drives
      // the loading bar until the game takes over.
      (function () {
        var t0 = performance.now(), parts = { js: 0, patch: 0, props: 0, ready: 0 }, weight = { js: 0.35, patch: 0.2, props: 0.3, ready: 0.15 };
        function draw() {
          var sum = 0;
          for (var k in weight) sum += weight[k] * Math.min(1, parts[k]);
          var el = document.getElementById('barFill');
          if (el) el.style.width = (sum * 100).toFixed(1) + '%';
        }
        window.__progress = function (k, v) { parts[k] = v; draw(); };
        (function creep() { if (parts.js >= 1) return; parts.js = Math.min(0.9, (performance.now() - t0) / 2000); draw(); requestAnimationFrame(creep); })();
        function grab(url) { return fetch(url).then(function (r) { if (!r.ok) throw new Error(url + ' ' + r.status); return r.arrayBuffer(); }); }
        var got = 0;
        window.__early = {
          patch: grab('./models/patch.glb').then(function (b) { window.__progress('patch', 1); return b; }),
          props: ['./models/props/props_batch1_medium.glb', './models/props/props_batch2_medium.glb'].map(function (u) {
            return grab(u).then(function (b) { got++; window.__progress('props', got / 2); return b; });
          }),
        };
      })();
    </script>

  <body>
    <canvas id="game" tabindex="0"></canvas>
    <script>
      // The WebGL context is created now, while the game's JavaScript is still downloading (starting the GPU process
      // took 0.6-0.9 s in cold-start measurements). The engine adopts it (src/main.ts).
      (function () {
        var c = document.getElementById('game');
        try { window.__gl = c.getContext('webgl2', { antialias: true, stencil: true, depth: true, alpha: false, premultipliedAlpha: false, preserveDrawingBuffer: false, powerPreference: 'high-performance' }); } catch (e) { window.__gl = null; }
      })();
    </script>
    <div id="hud">
      <div id="hearts" class="pill"><i></i><i></i><i></i></div>
      <div id="time" class="pill">0:00</div>
      <div id="count" class="pill"><span id="btnIcon"></span><span id="countNum">0</span></div>
    </div>
    <div id="hint">
      <div class="arrows"><i class="u"></i><i class="d"></i><i class="l"></i><i class="r"></i></div>
      <p class="swipe">Swipe to run</p>
      <p class="keys">A / D &nbsp;·&nbsp; W jump &nbsp;·&nbsp; S roll</p>
    </div>
    <div id="stats"></div>
    <div id="loading"><b>Patch is lacing his shoes...</b><div id="bar"><div id="barFill"></div></div></div>
    <div id="result"><div class="card">
      <h2>Patch needs<br>a little nap!</h2>
      <div class="row"><span>Time survived</span><b id="rTime">0:00</b></div>
      <div class="row"><span>Distance</span><b id="rDist">0 m</b></div>
      <div class="row"><span>Buttons collected</span><b id="rButtons">0</b></div>
      <div class="row best" id="rBestRow"><span>Best result</span><b id="rBest">0 m</b></div>
      <button id="again" type="button">Try again</button>
      <!-- Later (CrazyGames SDK rewarded video): "Watch a video for an extra stitch" goes here (Health.grantExtra). -->
    </div></div>
    <div id="error"><p>Oops! Something went wrong. Please reload.</p></div>
    <script>
      window.addEventListener('wheel', function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    </script>
