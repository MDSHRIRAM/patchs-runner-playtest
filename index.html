    <script>
      // Starts Patch's download at once, in parallel with the JavaScript, and drives the loading bar until the game takes over.
      (function () {
        var t0 = performance.now(), parts = { js: 0, patch: 0, ready: 0 }, weight = { js: 0.45, patch: 0.35, ready: 0.2 };
        function draw() {
          var sum = 0;
          for (var k in weight) sum += weight[k] * Math.min(1, parts[k]);
          var el = document.getElementById('barFill');
          if (el) el.style.width = (sum * 100).toFixed(1) + '%';
        }
        window.__progress = function (k, v) { parts[k] = v; draw(); };
        (function creep() { if (parts.js >= 1) return; parts.js = Math.min(0.9, (performance.now() - t0) / 2000); draw(); requestAnimationFrame(creep); })();
        window.__early = {
          patch: fetch('./models/patch.glb').then(function (r) {
            if (!r.ok) throw new Error('patch.glb ' + r.status);
            return r.arrayBuffer();
          }).then(function (b) { window.__progress('patch', 1); return b; }),
        };
      })();
    </script>

  <body>
    <canvas id="game" tabindex="0"></canvas>
    <script>
      // The WebGL context is created now, while the game's JavaScript is still downloading (starting the GPU process
      // took 0.6-0.9 s in cold-start measurements). The engine adopts it (src/main.ts).
      (function () {
        var c = document.getElementById('game');
        try { window.__gl = c.getContext('webgl2', { antialias: true, stencil: true, depth: true, alpha: false, premultipliedAlpha: false, preserveDrawingBuffer: false, powerPreference: 'high-performance' }); } catch (e) { window.__gl = null; }
      })();
    </script>
    <div id="hud">
      <div id="time" class="pill">0:00</div>
      <div id="count" class="pill"><span id="btnIcon"></span><span id="countNum">0</span></div>
    </div>
    <div id="hint">
      <div class="arrows"><i class="u"></i><i class="d"></i><i class="l"></i><i class="r"></i></div>
      <p class="swipe">Swipe to run</p>
      <p class="keys">A / D &nbsp;·&nbsp; W jump &nbsp;·&nbsp; S roll</p>
    </div>
    <div id="stats"></div>
    <div id="loading"><b>Patch is lacing his shoes...</b><div id="bar"><div id="barFill"></div></div></div>
    <div id="error"><p>Oops! Something went wrong. Please reload.</p></div>
